name: CI Build Verification

on:
  push:
    branches: [ imac2017-display-appliance, main, 3.1-maint, maint-3.5, 3.2-dev, dev-3.3.0, dev-3.4.0 ]
  pull_request:
    branches: [ imac2017-display-appliance, main, 3.1-maint, maint-3.5, 3.2-dev, dev-3.3.0, dev-3.4.0 ]

jobs:
  build-sender:
    name: Build Sender (${{ matrix.os }} - ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Tools
        run: |
          brew install jq ripgrep xcodegen

      - name: Check Localizations
        run: |
          ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Build Sender App
        run: |
          cd TargetBridge-Sender
          ./scripts/build_targetbridge_sender_app.sh
          file ../build/TargetBridge.app/Contents/MacOS/TargetBridge | grep -q "${{ matrix.arch }}"

      - name: Test Appliance Installer Lifecycle
        run: |
          TargetBridge-Sender/tests/test_appliance_installer_contract.zsh \
            TargetBridge-Sender/scripts/install_targetbridge_5k_sender_launch_agent.sh
          TargetBridge-Sender/tests/test_sleep_preference_lifecycle.zsh
          /bin/zsh TargetBridge-Sender/tests/test_display_lifecycle_protocol.zsh

      - name: Run Sender Unit Tests
        run: |
          cd TargetBridge-Sender
          xcodebuild test -project TargetBridge.xcodeproj -scheme TBDisplaySender -destination 'platform=macOS' -derivedDataPath .build/DerivedData

  build-receiver:
    name: Build Receiver (${{ matrix.os }} - ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install Dependencies
        run: |
          brew install ffmpeg jq ripgrep sdl2 sdl3 dylibbundler

      - name: Check Localizations
        run: |
          ./TargetBridge-Shared/scripts/check_localizations.sh

      - name: Run Receiver Parser Tests
        run: |
          cd TargetBridge-Receiver/TBReceiverC
          # Hosted macOS runners expose a virtual GPU but are not physical
          # scanout/cadence evidence. Keep all GPU work and accounting checks;
          # reserve complete drawable-callback gates for real hardware.
          TB_TEST_HEADLESS_PRESENTATION=1 make test

      - name: Build 5K Appliance Receiver
        run: |
          cd TargetBridge-Receiver/TBReceiverC
          make benchmark_targetbridge_raw_receiver_universal
          file benchmark_targetbridge_raw_receiver_universal | grep -q "${{ matrix.arch }}"

      - name: Build Receiver App
        run: |
          cd TargetBridge-Receiver
          ./scripts/build_tbreceiver_c_app.sh
